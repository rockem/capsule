name: Publish

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme capsule \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/capsule.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/capsule.xcarchive/Products/Applications/capsule.app" \
            "$RUNNER_TEMP/Capsule-${{ github.event.release.tag_name }}.zip"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP/Capsule-${{ github.event.release.tag_name }}.zip"
