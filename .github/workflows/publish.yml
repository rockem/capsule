name: Publish

on:
  release:
    types: [created]

permissions:
  contents: write
      
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme capsule \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/capsule.xcarchive" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/capsule.xcarchive/Products/Applications/capsule.app" \
            "$RUNNER_TEMP/Capsule-${{ github.event.release.tag_name }}.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "$RUNNER_TEMP/Capsule-${{ github.event.release.tag_name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

